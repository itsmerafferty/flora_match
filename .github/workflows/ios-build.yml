name: iOS Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Restore pub dependencies
        run: flutter pub get

      - name: Build iOS App Bundle (Debug)
        run: |
          flutter build ios --debug --no-codesign --dart-define=ENV=dev

      - name: Build iOS App Bundle (Release)
        if: github.ref == 'refs/heads/main'
        run: |
          flutter build ios --release --no-codesign --dart-define=ENV=prod

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-build-debug
          path: build/ios/iphoneos/
          retention-days: 7

      - name: Upload iOS build artifact (Release)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v3
        with:
          name: ios-build-release
          path: build/ios/iphoneos/
          retention-days: 30
